      - url: "{{ _.api_url }}/api/v1/auth/login"
        name: login
        meta:
          id: req_fc0a1fd61b6649c596b46f72f0284c94
          created: 1771559728334
          modified: 1772138532493
          isPrivate: false
          sortKey: -1771559728334
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
            	"email": "admin@example.com",
            	"password": "Mudar123"
            }
        headers:
          - name: Content-Type
            value: application/json
            id: pair_06055996ff1647cebf499b0b083347cc
          - name: User-Agent
            value: insomnia/11.1.0
            id: pair_b581564de9d74697b5a89e7663680b92
          - id: pair_6c8586d50254468cb97e0549f5eed203
            name: API_KEY
            value: "{{ _.timeless_api.api_key }}"
            disabled: false
        scripts:
          afterResponse: |-
            // Access the JSON response body
            const jsonBody = insomnia.response.json();

            // Check if the status code is as expected
            insomnia.test('Check if status is 200', () => {
              insomnia.expect(insomnia.response.code).to.eql(200);
            });

            // Set an environment variable with a value from the response body
            if (insomnia.response.code == 200) {
              const tokenValue = jsonBody.body.token.split('|')[1];
            	let timelessApi = insomnia.environment.get("timeless_api") || {};
            	
            	timelessApi.auth_token = tokenValue;
              insomnia.environment.set("timeless_api", timelessApi);
            }
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
